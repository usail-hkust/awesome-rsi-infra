# One record per paper, project, blog post or report. README tables are generated from this file:
#   python scripts/build_readme.py
#
# Fields
#   title    full title (papers: exactly as on arXiv; projects: "Name: what it is")
#   year     publication or first-release year; month (optional) only sorts within a year
#   venue    arXiv / conference / Nature / Blog / Report / GitHub ...
#   org      optional; lab or company when it matters
#   section  one id from data/sections.yaml (a group id when the section has groups)
#   links    any of: paper, code, blog, project, docs
#   access   open   = code or system released
#            closed = described publicly (blog, report) but not released
#            paper  = paper only, no code
#   note     one line: what this gives an improvement loop

